# C3PO — Cloudflare Worker configuration
# account_id is intentionally omitted — set CLOUDFLARE_ACCOUNT_ID env var at deploy time.
# This keeps the config portable between personal and PI org accounts.

name = "c3po"
main = "worker.js"
compatibility_date = "2025-01-01"

# Secrets (set via `wrangler secret put` — never committed):
#   VOYAGE_API_KEY        — Voyage AI embedding API key
#   PINECONE_API_KEY      — Pinecone API key
#   PINECONE_C3PO_HOST    — Pinecone index host URL
#   ANTHROPIC_API_KEY     — Anthropic Claude API key
#   ADMIN_KEY             — Admin endpoint auth (generate per security-policy.md)
#   MCP_API_KEY           — MCP server auth key

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c088e51da40f4e1abe0a5c7a507114e1"  # created 2026-05-16; document in MIGRATION.md when migrating to PI org account

# Future bindings (uncomment when ready):

