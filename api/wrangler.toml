# C3PO — Cloudflare Worker configuration
# account_id is intentionally omitted — set CLOUDFLARE_ACCOUNT_ID env var at deploy time.
# This keeps the config portable between personal and PI org accounts.

name = "c3po"
main = "worker.js"
compatibility_date = "2025-01-01"

# Secrets (set via `wrangler secret put` — never committed):
#   VOYAGE_API_KEY        — Voyage AI embedding API key
#   PINECONE_API_KEY      — Pinecone API key
#   PINECONE_C3PO_HOST    — Pinecone index host URL
#   ANTHROPIC_API_KEY     — Anthropic Claude API key
#   ADMIN_KEY             — Admin endpoint auth (generate per security-policy.md)
#   MCP_API_KEY           — MCP server auth key
#   ORACLE_BOT_TOKEN      — c3po_oracle Discord bot token
#   ORACLE_APPLICATION_ID — c3po_oracle Discord application ID
#   ORACLE_PUBLIC_KEY     — c3po_oracle Discord app public key (Ed25519, for sig verification)
#
# Optional env vars (set in [vars] below or via wrangler secret put):
#   ORACLE_ALLOWED_CHANNEL_IDS — comma-separated Discord channel IDs; empty = all channels

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "3ddfe6cc538348beb1b1df4219f426b8"  # C3PO_KV — created 2026-05-31 on PI org CF account (7e8c7969b2464d23795c555bc6a32af8)

[[queues.producers]]
binding = "ORACLE_QUEUE"
queue   = "c3po-oracle"

[[queues.consumers]]
queue              = "c3po-oracle"
max_batch_size     = 1
max_batch_timeout  = 1
max_retries        = 2

