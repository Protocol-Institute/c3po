name: Sync Substack

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily (midnight PT)
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install voyageai pinecone anthropic python-dotenv beautifulsoup4

      - name: Sync Substack
        env:
          VOYAGE_API_KEY:    ${{ secrets.VOYAGE_API_KEY }}
          PINECONE_API_KEY:  ${{ secrets.PINECONE_API_KEY }}
          PINECONE_C3PO_HOST: ${{ secrets.PINECONE_C3PO_HOST }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 ingest/sync_substack.py

      - name: Commit state changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources/substack/registry.json sources/substack/api_metadata.json sources/substack/enriched_meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: substack sync $(date -u +%Y-%m-%d)"
            git push
          fi
